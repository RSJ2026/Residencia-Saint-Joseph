<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega de Turno - Residencia Saint Joseph</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen text-slate-800 pb-12">

  <!-- ENCABEZADO Y LOGO -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <!-- LOGO RESIDENCIA SAINT JOSEPH -->
      <div class="flex items-center gap-3">
        <img src="logo.jpg" alt="Logo Residencia Saint Joseph" class="h-16 w-auto object-contain bg-white rounded-lg p-1" onerror="this.style.display='none'; document.getElementById('svg-fallback').style.display='block';">
        
        <!-- Fallback SVG por si aún no subes la foto logo.jpg -->
        <div id="svg-fallback" class="hidden flex items-center gap-2">
          <svg class="w-12 h-12 text-slate-800" viewBox="0 0 100 100" fill="currentColor">
            <path d="M50 35 C40 20 20 25 20 42 C20 60 45 78 50 82 C55 78 80 60 80 42 C80 25 60 20 50 35 Z" fill="#1e293b"/>
          </svg>
        </div>

        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900">Saint JOSEPH</h1>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Residencia Adulto Mayor</p>
        </div>
      </div>

      <!-- SELECCIÓN DE JEFE DE TURNO Y FECHA -->
      <div class="flex flex-wrap items-center gap-3 bg-slate-100 p-2 rounded-xl border border-slate-200 text-sm">
        <div>
          <label class="block text-xs text-slate-500 font-semibold">Jefe de Turno:</label>
          <select id="currentSupervisorSelect" onchange="changeSupervisor(this.value)" class="bg-white border border-slate-300 rounded-md px-2 py-1 font-semibold text-slate-700">
            <!-- Cargado dinámicamente -->
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 font-semibold">Fecha del Turno:</label>
          <input type="date" id="shiftDateInput" class="bg-white border border-slate-300 rounded-md px-2 py-1 font-semibold text-slate-700">
        </div>
        <div>
          <label class="block text-xs text-slate-500 font-semibold">Horario:</label>
          <select id="shiftTypeSelect" class="bg-white border border-slate-300 rounded-md px-2 py-1 font-semibold text-slate-700">
            <!-- Cargado dinámicamente -->
          </select>
        </div>
      </div>

    </div>
  </header>

  <!-- NAVEGACIÓN PRINCIPAL -->
  <main class="max-w-6xl mx-auto px-4 mt-6">
    <nav class="flex border-b border-slate-200 mb-6 gap-2 overflow-x-auto pb-1">
      <button onclick="switchTab('tab-entrega')" id="btn-tab-entrega" class="tab-btn px-4 py-2 font-bold text-sm rounded-t-lg bg-sky-600 text-white border-b-2 border-sky-600">
        📝 Entrega de Turno
      </button>
      <button onclick="switchTab('tab-residentes')" id="btn-tab-residentes" class="tab-btn px-4 py-2 font-bold text-sm rounded-t-lg bg-white text-slate-600 hover:bg-slate-100 border-b-2 border-transparent">
        👴 Ficha de Residentes
      </button>
      <button onclick="switchTab('tab-historico')" id="btn-tab-historico" class="tab-btn px-4 py-2 font-bold text-sm rounded-t-lg bg-white text-slate-600 hover:bg-slate-100 border-b-2 border-transparent">
        📚 Histórico de Entregas
      </button>
      <button onclick="switchTab('tab-config')" id="btn-tab-config" class="tab-btn px-4 py-2 font-bold text-sm rounded-t-lg bg-white text-slate-600 hover:bg-slate-100 border-b-2 border-transparent">
        ⚙️ Configurar Turnos y Perfiles
      </button>
    </nav>

    <!-- PESTAÑA 1: ENTREGA DE TURNO -->
    <section id="tab-entrega" class="tab-content">
      
      <!-- CHECKLIST DE VERIFICACIÓN -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h3 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
          ☑️ Checklist de Verificación de Turno
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100">
            <input type="checkbox" id="chk1" class="w-5 h-5 text-sky-600 rounded">
            <span class="text-sm font-medium text-slate-700">Entrega de canastos con insumos personales</span>
          </label>
          <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100">
            <input type="checkbox" id="chk2" class="w-5 h-5 text-sky-600 rounded">
            <span class="text-sm font-medium text-slate-700">Higiene, cambios de pañal y posturales completados</span>
          </label>
          <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100">
            <input type="checkbox" id="chk3" class="w-5 h-5 text-sky-600 rounded">
            <span class="text-sm font-medium text-slate-700">Hidratación diaria</span>
          </label>
        </div>
      </div>

      <!-- NOVEDADES GENERALES -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h3 class="text-base font-bold text-slate-800 mb-2">📢 Novedades Generales de la Residencia</h3>
        <textarea id="generalNotes" rows="3" placeholder="Escriba avisos generales, visitas médicas, entregas de insumos o novedades del turno..." class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-sky-500"></textarea>
      </div>

      <!-- OBSERVACIONES POR RESIDENTE -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h3 class="text-base font-bold text-slate-800 mb-4">🩺 Observaciones por Residente</h3>
        <div id="residentShiftCards" class="space-y-4">
          <!-- Cargado dinámicamente -->
        </div>
      </div>

      <!-- BOTONES DE ACCIÓN -->
      <div class="flex flex-wrap gap-3 justify-end">
        <button onclick="saveShiftLog()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-3 rounded-xl shadow transition flex items-center gap-2">
          💾 Finalizar y Registrar Entrega de Turno
        </button>
      </div>
    </section>

    <!-- PESTAÑA 2: FICHA DE RESIDENTES -->
    <section id="tab-residentes" class="tab-content hidden">
      <!-- FORMULARIO AGREGAR RESIDENTE -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h3 class="text-base font-bold text-slate-800 mb-4">➕ Registrar Nuevo Residente</h3>
        <form id="residentForm" onsubmit="saveResident(event)" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo del Residente *</label>
              <input type="text" id="resName" required placeholder="Ej. María González" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Habitación / Cama *</label>
              <input type="text" id="resRoom" required placeholder="Ej. Habitación 102 - Cama A" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre del Apoderado</label>
              <input type="text" id="resGuardian" placeholder="Ej. Juan Pérez (Hijo)" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono del Apoderado</label>
              <input type="tel" id="resGuardianPhone" placeholder="Ej. +56 9 1234 5678" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Grado de Dependencia</label>
              <select id="resDep" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500">
                <option value="Leve">Leve</option>
                <option value="Moderada">Moderada</option>
                <option value="Severa">Severa</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Diagnósticos / Observaciones de Salud</label>
              <input type="text" id="resDiag" placeholder="Ej. Hipertensión, Diabetes..." class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500">
            </div>
          </div>
          <div class="flex justify-end">
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2 rounded-lg text-sm shadow">
              Guardar Residente
            </button>
          </div>
        </form>
      </div>

      <!-- LISTA DE RESIDENTES -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <h3 class="text-base font-bold text-slate-800 mb-4">📋 Listado de Residentes Activos</h3>
        <div id="residentsListContainer" class="grid grid-
