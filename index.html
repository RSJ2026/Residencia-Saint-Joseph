<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega de Turno - Residencia Saint Joseph</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen text-slate-800 pb-12">

  <!-- ENCABEZADO -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <div class="flex items-center gap-3">
        <img src="logo.jpg" alt="Logo Residencia Saint Joseph" class="h-16 w-auto object-contain bg-white rounded-lg p-1" onerror="this.style.display='none'; document.getElementById('svg-fallback').style.display='flex';">
        <div id="svg-fallback" class="hidden items-center gap-2">
          <svg class="w-12 h-12 text-slate-800" viewBox="0 0 100 100" fill="currentColor">
            <path d="M50 35 C40 20 20 25 20 42 C20 60 45 78 50 82 C55 78 80 60 80 42 C80 25 60 20 50 35 Z" fill="#1e293b"/>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900">Residencia Saint Joseph</h1>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Residencia Adulto Mayor</p>
        </div>
      </div>

      <!-- SELECCIÓN DE JEFE DE TURNO, FECHA Y HORARIO -->
      <div class="flex flex-wrap items-center gap-3 bg-slate-100 p-2 rounded-xl border border-slate-200 text-sm">
        <div>
          <label class="block text-xs text-slate-500 font-semibold">Jefe de Turno:</label>
          <select id="currentSupervisorSelect" onchange="changeSupervisor(this.value)" class="bg-white border border-slate-300 rounded-md px-2 py-1 font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
            <option value="Antonio González">Antonio González</option>
            <option value="Jennifer Soto">Jennifer Soto</option>
            <option value="Katerin Sobarzo">Katerin Sobarzo</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 font-semibold">Fecha del Turno:</label>
          <input type="date" id="shiftDateInput" class="bg-white border border-slate-300 rounded-md px-2 py-1 font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 font-semibold">Horario:</label>
          <select id="shiftTypeSelect" class="bg-white border border-slate-300 rounded-md px-2 py-1 font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
            <option value="Día: 08:00 hrs. - 20:00 hrs.">Día: 08:00 hrs. - 20:00 hrs.</option>
            <option value="Noche: 20:00 hrs. - 08:00 hrs.">Noche: 20:00 hrs. - 08:00 hrs.</option>
          </select>
        </div>
      </div>

    </div>
  </header>

  <!-- NAVEGACIÓN -->
  <main class="max-w-6xl mx-auto px-4 mt-6">
    <nav class="flex border-b border-slate-200 mb-6 gap-2 overflow-x-auto pb-1">
      <button onclick="switchTab('tab-entrega')" id="btn-tab-entrega" class="tab-btn px-4 py-2 font-bold text-sm rounded-t-lg bg-sky-600 text-white border-b-2 border-sky-600 transition">
        📝 Entrega de Turno
      </button>
      <button onclick="switchTab('tab-residentes')" id="btn-tab-residentes" class="tab-btn px-4 py-2 font-bold text-sm rounded-t-lg bg-white text-slate-600 hover:bg-slate-100 border-b-2 border-transparent transition">
        👴 Ficha de Residentes
      </button>
      <button onclick="switchTab('tab-historico')" id="btn-tab-historico" class="tab-btn px-4 py-2 font-bold text-sm rounded-t-lg bg-white text-slate-600 hover:bg-slate-100 border-b-2 border-transparent transition">
        📚 Histórico y Respaldos
      </button>
    </nav>

    <!-- PESTAÑA 1: ENTREGA DE TURNO -->
    <section id="tab-entrega" class="tab-content">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h3 class="text-base font-bold text-slate-800 mb-2">📢 Novedades Generales del Turno</h3>
        <textarea id="generalNotes" rows="3" placeholder="Escriba avisos generales, contingencias o información relevante..." class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h3 class="text-base font-bold text-slate-800 mb-4">🩺 Observaciones por Residente</h3>
        <div id="residentShiftCards" class="space-y-4">
          <!-- Carga dinámicamente -->
        </div>
      </div>

      <div class="flex justify-end">
        <button onclick="saveShiftLog()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-3 rounded-xl shadow transition flex items-center gap-2">
          💾 Finalizar y Registrar Entrega de Turno
        </button>
      </div>
    </section>

    <!-- PESTAÑA 2: REGISTRO DE RESIDENTES -->
    <section id="tab-residentes" class="tab-content hidden">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h3 class="text-base font-bold text-slate-800 mb-4">➕ Ficha Médica del Residente</h3>
        <form id="residentForm" onsubmit="saveResident(event)" class="space-y-4">
          <input type="hidden" id="editResidentId">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo *</label>
              <input type="text" id="resName" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">RUT *</label>
              <input type="text" id="resRut" placeholder="12.345.678-9" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha de Nacimiento *</label>
              <input type="date" id="resBirthdate" onchange="calculateAge()" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Edad</label>
              <input type="number" id="resAge" readonly class="w-full bg-slate-100 border border-slate-300 rounded-lg p-2 text-sm text-slate-600">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Grado de Discapacidad</label>
              <select id="resDisability" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                <option value="Sin discapacidad">Sin discapacidad</option>
                <option value="Leve">Leve</option>
                <option value="Moderada">Moderada</option>
                <option value="Grave">Grave</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Enfermedades Diagnosticadas</label>
              <textarea id="resDiseases" rows="2" placeholder="Hipertensión, Diabetes, Alzheimer..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Medicamentos y Dosis</label>
              <textarea id="resMeds" rows="2" placeholder="Losartán 50mg cada 12 hrs, Paracetamol..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
            </div>
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="resetResidentForm()" class="px-4 py-2 text-sm bg-slate-100 text-slate-600 font-semibold rounded-lg hover:bg-slate-200">Limpiar Formulario</button>
            <button type="submit" class="px-5 py-2 text-sm bg-sky-600 text-white font-bold rounded-lg hover:bg-sky-700 shadow">Guardar Residente</button>
          </div>
        </form>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <h3 class="text-base font-bold text-slate-800 mb-4">📋 Residentes Registrados</h3>
        <div id="residentsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Carga dinámicamente -->
        </div>
      </div>
    </section>

    <!-- PESTAÑA 3: HISTÓRICO Y RESPALDOS -->
    <section id="tab-historico" class="tab-content hidden">
      <!-- HERRAMIENTAS DE DESCARGA Y RESPALDO -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h3 class="text-base font-bold text-slate-800 mb-3">📥 Copia de Seguridad y Respaldos</h3>
        <p class="text-xs text-slate-500 mb-4">Descarga tus entregas para no perder los datos o impórtalas en otro dispositivo.</p>
        <div class="flex flex-wrap gap-3">
          <button onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-2 shadow">
            📥 Descargar Respaldo de Datos (JSON)
          </button>
          <label class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-4 py-2 rounded-lg text-sm cursor-pointer shadow flex items-center gap-2">
            📤 Cargar / Importar Respaldo
            <input type="file" id="importFileInput" onchange="importData(event)" accept=".json" class="hidden">
          </label>
          <button onclick="clearHistory()" class="bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 font-semibold px-4 py-2 rounded-lg text-sm ml-auto">
            Vaciar Histórico
          </button>
        </div>
      </div>

      <div id="historyList" class="space-y-4">
        <!-- Carga dinámicamente -->
      </div>
    </section>
  </main>

  <script>
    let appState = {
      supervisors: ["Antonio González", "Jennifer Soto", "Katerin Sobarzo"],
      residents: JSON.parse(localStorage.getItem('rsj_residents')) || [],
      history: JSON.parse(localStorage.getItem('rsj_history')) || [],
      currentSupervisor: localStorage.getItem('rsj_currentSupervisor') || "Antonio González"
    };

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('shiftDateInput').valueAsDate = new Date();
      renderResidents();
      renderHistory();
      renderShiftCards();
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-sky-600', 'text-white', 'border-sky-600');
        btn.classList.add('bg-white', 'text-slate-600', 'border-transparent');
      });

      document.getElementById(tabId).classList.remove('hidden');
      const activeBtn = document.getElementById('btn-' + tabId);
      activeBtn.classList.remove('bg-white', 'text-slate-600', 'border-transparent');
      activeBtn.classList.add('bg-sky-600', 'text-white', 'border-sky-600');
    }

    function calculateAge() {
      const birth = new Date(document.getElementById('resBirthdate').value);
      if (isNaN(birth.getTime())) return;
      const today = new Date();
      let age = today.getFullYear() - birth.getFullYear();
      const m = today.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
      document.getElementById('resAge').value = age;
    }

    function saveResident(e) {
      e.preventDefault();
      const id = document.getElementById('editResidentId').value;
      const name = document.getElementById('resName').value.trim();
      const rut = document.getElementById('resRut').value.trim();
      const birthdate = document.getElementById('resBirthdate').value;
      const age = document.getElementById('resAge').value;
      const disability = document.getElementById('resDisability').value;
      const diseases = document.getElementById('resDiseases').value.trim();
      const meds = document.getElementById('resMeds').value.trim();

      if (id) {
        const res = appState.residents.find(r => r.id === id);
        if (res) {
          Object.assign(res, { name, rut, birthdate, age, disability, diseases, meds });
        }
      } else {
        appState.residents.push({ id: Date.now().toString(), name, rut, birthdate, age, disability, diseases, meds });
      }

      localStorage.setItem('rsj_residents', JSON.stringify(appState.residents));
      resetResidentForm();
      renderResidents();
      renderShiftCards();
    }

    function resetResidentForm() {
      document.getElementById('editResidentId').value = '';
      document.getElementById('residentForm').reset();
    }

    function editResident(id) {
      const res = appState.residents.find(r => r.id === id);
      if (res) {
        document.getElementById('editResidentId').value = res.id;
        document.getElementById('resName').value = res.name;
        document.getElementById('resRut').value = res.rut;
        document.getElementById('resBirthdate').value = res.birthdate;
        document.getElementById('resAge').value = res.age;
        document.getElementById('resDisability').value = res.disability;
        document.getElementById('resDiseases').value = res.diseases;
        document.getElementById('resMeds').value = res.meds;
        switchTab('tab-residentes');
      }
    }

    function deleteResident(id) {
      if (confirm('¿Desea eliminar a este residente?')) {
        appState.residents = appState.residents.filter(r => r.id !== id);
        localStorage.setItem('rsj_residents', JSON.stringify(appState.residents));
        renderResidents();
        renderShiftCards();
      }
    }

    function renderResidents() {
      const list = document.getElementById('residentsList');
      list.innerHTML = '';
      if (appState.residents.length === 0) {
        list.innerHTML = `<p class="text-sm text-slate-500 italic col-span-2">No hay residentes registrados.</p>`;
        return;
      }
      appState.residents.forEach(r => {
        const div = document.createElement('div');
        div.className = "bg-slate-50 border border-slate-200 rounded-lg p-4";
        div.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <h4 class="font-bold text-slate-800">${r.name}</h4>
              <p class="text-xs text-slate-500">RUT: ${r.rut} | ${r.age} años</p>
            </div>
            <span class="text-xs px-2 py-0.5 rounded font-semibold ${r.disability === 'Grave' ? 'bg-rose-100 text-rose-800' : 'bg-sky-100 text-sky-800'}">${r.disability}</span>
          </div>
          <p class="text-xs text-slate-600 mb-1"><strong>Enfermedades:</strong> ${r.diseases || 'Ninguna'}</p>
          <p class="text-xs text-slate-600"><strong>Medicamentos:</strong> ${r.meds || 'Ninguno'}</p>
          <div class="flex justify-end gap-3 mt-3 pt-2 border-t border-slate-200 text-xs font-semibold">
            <button onclick="editResident('${r.id}')" class="text-sky-600 hover:text-sky-800">Editar</button>
            <button onclick="deleteResident('${r.id}')" class="text-rose-600 hover:text-rose-800">Eliminar</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function renderShiftCards() {
      const container = document.getElementById('residentShiftCards');
      container.innerHTML = '';
      if (appState.residents.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-500 italic">Agregue residentes en la pestaña "Ficha de Residentes".</p>`;
        return;
      }
      appState.residents.forEach(r => {
        const div = document.createElement('div');
        div.className = "p-4 bg-slate-50 border border-slate-200 rounded-lg";
        div.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <span class="font-bold text-slate-800 text-sm">${r.name} (${r.age} años)</span>
            <span class="text-xs font-semibold px-2 py-0.5 bg-slate-200 rounded">${r.disability}</span>
          </div>
          <textarea id="obs-${r.id}" rows="2" placeholder="Estado de salud, alimentación, novedades de ${r.name}..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white"></textarea>
        `;
        container.appendChild(div);
      });
    }

    function saveShiftLog() {
      const supervisor = document.getElementById('currentSupervisorSelect').value;
      const date = document.getElementById('shiftDateInput').value;
      const shiftType = document.getElementById('shiftTypeSelect').value;
      const generalNotes = document.getElementById('generalNotes').value.trim();

      const residentObs = appState.residents.map(r => ({
        name: r.name,
        rut: r.rut,
        obs: (document.getElementById(`obs-${r.id}`)?.value || '').trim()
      }));

      const entry = { id: Date.now().toString(), timestamp: new Date().toLocaleString('es-CL'), supervisor, date, shiftType, generalNotes, residentObs };
      appState.history.unshift(entry);
      localStorage.setItem('rsj_history', JSON.stringify(appState.history));
      alert('✅ Entrega de Turno registrada correctamente.');

      document.getElementById('generalNotes').value = '';
      appState.residents.forEach(r => {
        const el = document.getElementById(`obs-${r.id}`);
        if (el) el.value = '';
      });

      renderHistory();
      switchTab('tab-historico');
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      container.innerHTML = '';
      if (appState.history.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-xl border border-slate-200 text-center text-slate-500 text-sm">No existen entregas registradas.</div>`;
        return;
      }
      appState.history.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-3";
        const obsHTML = item.residentObs.map(ro => `
          <div class="text-xs bg-slate-50 p-2 rounded border border-slate-100">
            <span class="font-semibold text-slate-800">${ro.name}:</span> <span class="text-slate-600">${ro.obs || 'Sin novedades.'}</span>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex flex-wrap items-center justify-between border-b border-slate-100 pb-3 gap-2">
            <div>
              <span class="text-sm font-bold text-slate-900">${item.supervisor}</span>
              <span class="text-xs text-slate-500 ml-2">📅 ${item.date} (${item.shiftType})</span>
            </div>
            <span class="text-xs text-slate-400">Hora registro: ${item.timestamp}</span>
          </div>
          ${item.generalNotes ? `<div class="text-xs text-slate-700 bg-amber-50 p-2.5 rounded border border-amber-100"><strong>Novedades Generales:</strong> ${item.generalNotes}</div>` : ''}
          <div class="space-y-1">${obsHTML}</div>
        `;
        container.appendChild(card);
      });
    }

    // DESCARGAR RESPALDO EN JSON
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Respaldo_Saint_Joseph_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // CARGAR RESPALDO DESDE JSON
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.residents && imported.history) {
            appState.residents = imported.residents;
            appState.history = imported.history;
            localStorage.setItem('rsj_residents', JSON.stringify(appState.residents));
            localStorage.setItem('rsj_history', JSON.stringify(appState.history));
            renderResidents();
            renderHistory();
            renderShiftCards();
            alert('✅ Datos importados correctamente.');
          } else {
            alert('❌ El archivo no tiene el formato correcto.');
          }
        } catch (err) {
          alert('❌ Error al leer el archivo.');
        }
      };
      reader.readAsText(file);
    }

    function clearHistory() {
      if (confirm('¿Desea borrar todo el historial?')) {
        appState.history = [];
        localStorage.removeItem('rsj_history');
        renderHistory();
      }
    }
  </script>
</body>
</html>
