<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega de Turno - Residencia Saint Joseph</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen text-slate-800 pb-12">

  <!-- ENCABEZADO Y LOGO -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <!-- LOGO RESIDENCIA SAINT JOSEPH -->
      <div class="flex items-center gap-3">
        <img src="logo.jpg" alt="Logo Residencia Saint Joseph" class="h-16 w-auto object-contain bg-white rounded-lg p-1" onerror="this.style.display='none'; document.getElementById('svg-fallback').style.display='flex';">
        
        <!-- Fallback SVG en caso de no encontrar la imagen logo.jpg -->
        <div id="svg-fallback" class="hidden items-center gap-2">
          <svg class="w-12 h-12 text-slate-800" viewBox="0 0 100 100" fill="currentColor">
            <path d="M50 35 C40 20 20 25 20 42 C20 60 45 78 50 82 C55 78 80 60 80 42 C80 25 60 20 50 35 Z" fill="#1e293b"/>
          </svg>
        </div>

        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900">Saint JOSEPH</h1>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Residencia Adulto Mayor</p>
        </div>
      </div>

      <!-- SELECCIÓN DE JEFE DE TURNO, FECHA Y HORARIO -->
      <div class="flex flex-wrap items-center gap-3 bg-slate-100 p-2 rounded-xl border border-slate-200 text-sm">
        <div>
          <label class="block text-xs text-slate-500 font-semibold">Jefe de Turno:</label>
          <select id="currentSupervisorSelect" onchange="changeSupervisor(this.value)" class="bg-white border border-slate-300 rounded-md px-2 py-1 font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
            <!-- Cargado dinámicamente -->
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 font-semibold">Fecha del Turno:</label>
          <input type="date" id="shiftDateInput" class="bg-white border border-slate-300 rounded-md px-2 py-1 font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 font-semibold">Horario:</label>
          <select id="shiftTypeSelect" class="bg-white border border-slate-300 rounded-md px-2 py-1 font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
            <!-- Cargado dinámicamente -->
          </select>
        </div>
      </div>

    </div>
  </header>

  <!-- NAVEGACIÓN PRINCIPAL -->
  <main class="max-w-6xl mx-auto px-4 mt-6">
    <nav class="flex border-b border-slate-200 mb-6 gap-2 overflow-x-auto pb-1">
      <button onclick="switchTab('tab-entrega')" id="btn-tab-entrega" class="tab-btn px-4 py-2 font-bold text-sm rounded-t-lg bg-sky-600 text-white border-b-2 border-sky-600 transition">
        📝 Entrega de Turno
      </button>
      <button onclick="switchTab('tab-residentes')" id="btn-tab-residentes" class="tab-btn px-4 py-2 font-bold text-sm rounded-t-lg bg-white text-slate-600 hover:bg-slate-100 border-b-2 border-transparent transition">
        👴 Ficha de Residentes
      </button>
      <button onclick="switchTab('tab-historico')" id="btn-tab-historico" class="tab-btn px-4 py-2 font-bold text-sm rounded-t-lg bg-white text-slate-600 hover:bg-slate-100 border-b-2 border-transparent transition">
        📚 Histórico de Entregas
      </button>
      <button onclick="switchTab('tab-config')" id="btn-tab-config" class="tab-btn px-4 py-2 font-bold text-sm rounded-t-lg bg-white text-slate-600 hover:bg-slate-100 border-b-2 border-transparent transition">
        ⚙️ Configurar Turnos y Perfiles
      </button>
    </nav>

    <!-- PESTAÑA 1: ENTREGA DE TURNO -->
    <section id="tab-entrega" class="tab-content">
      
      <!-- CHECKLIST DE VERIFICACIÓN -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h3 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
          ☑️ Checklist de Verificación de Turno
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100">
            <input type="checkbox" id="chk1" class="w-5 h-5 text-sky-600 rounded">
            <span class="text-sm font-medium text-slate-700">Entrega de canastos con insumos personales</span>
          </label>
          <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100">
            <input type="checkbox" id="chk2" class="w-5 h-5 text-sky-600 rounded">
            <span class="text-sm font-medium text-slate-700">Higiene, cambios de pañal y posturales completados</span>
          </label>
          <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100">
            <input type="checkbox" id="chk3" class="w-5 h-5 text-sky-600 rounded">
            <span class="text-sm font-medium text-slate-700">Hidratación diaria</span>
          </label>
        </div>
      </div>

      <!-- NOVEDADES GENERALES -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h3 class="text-base font-bold text-slate-800 mb-2">📢 Novedades Generales de la Residencia</h3>
        <textarea id="generalNotes" rows="3" placeholder="Escriba avisos generales, visitas médicas, entregas de insumos o novedades del turno..." class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
      </div>

      <!-- OBSERVACIONES POR RESIDENTE -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h3 class="text-base font-bold text-slate-800 mb-4">🩺 Observaciones por Residente</h3>
        <div id="residentShiftCards" class="space-y-4">
          <!-- Cargado dinámicamente -->
        </div>
      </div>

      <!-- BOTONES DE ACCIÓN -->
      <div class="flex flex-wrap gap-3 justify-end">
        <button onclick="saveShiftLog()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-3 rounded-xl shadow transition flex items-center gap-2">
          💾 Finalizar y Registrar Entrega de Turno
        </button>
      </div>
    </section>

    <!-- PESTAÑA 2: FICHA DE RESIDENTES -->
    <section id="tab-residentes" class="tab-content hidden">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
        <h3 class="text-base font-bold text-slate-800 mb-4">➕ Registrar Nuevo Residente</h3>
        <form id="residentForm" onsubmit="saveResident(event)" class="space-y-4">
          <input type="hidden" id="editResidentId">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo del Residente *</label>
              <input type="text" id="resName" required placeholder="Ej. María González" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Habitación / Cama</label>
              <input type="text" id="resRoom" placeholder="Ej. Habitación 102 - Cama A" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>
            <div class="md:col-span-2">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Antecedentes Médicos / Cuidados Especiales</label>
              <textarea id="resNotes" rows="2" placeholder="Diagnósticos, alergias, régimen alimentario, tratamiento especial..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
            </div>
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="resetResidentForm()" class="px-4 py-2 text-sm bg-slate-100 text-slate-600 font-semibold rounded-lg hover:bg-slate-200">Limpiar</button>
            <button type="submit" class="px-5 py-2 text-sm bg-sky-600 text-white font-bold rounded-lg hover:bg-sky-700 shadow">Guardar Residente</button>
          </div>
        </form>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <h3 class="text-base font-bold text-slate-800 mb-4">📋 Lista de Residentes Activos</h3>
        <div id="residentsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Cargado dinámicamente -->
        </div>
      </div>
    </section>

    <!-- PESTAÑA 3: HISTÓRICO DE ENTREGAS -->
    <section id="tab-historico" class="tab-content hidden">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6 flex flex-wrap items-center justify-between gap-4">
        <h3 class="text-base font-bold text-slate-800">📚 Histórico de Registros de Turno</h3>
        <button onclick="clearHistory()" class="text-xs bg-rose-50 text-rose-600 border border-rose-200 px-3 py-1.5 rounded-lg hover:bg-rose-100 font-semibold">Vaciar Histórico</button>
      </div>
      <div id="historyList" class="space-y-4">
        <!-- Cargado dinámicamente -->
      </div>
    </section>

    <!-- PESTAÑA 4: CONFIGURAR TURNOS Y PERFILES -->
    <section id="tab-config" class="tab-content hidden">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- JEFES DE TURNO -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
          <h3 class="text-base font-bold text-slate-800 mb-4">👤 Jefes de Turno</h3>
          <form onsubmit="addSupervisor(event)" class="flex gap-2 mb-4">
            <input type="text" id="newSupervisorInput" required placeholder="Nombre del Jefe de Turno" class="flex-1 border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
            <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-4 py-2 rounded-lg text-sm">Agregar</button>
          </form>
          <ul id="supervisorsList" class="divide-y divide-slate-100">
            <!-- Cargado dinámicamente -->
          </ul>
        </div>

        <!-- HORARIOS Y TIPOS DE TURNO -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
          <h3 class="text-base font-bold text-slate-800 mb-4">⏰ Horarios de Turnos</h3>
          <form onsubmit="addShiftType(event)" class="flex gap-2 mb-4">
            <input type="text" id="newShiftTypeInput" required placeholder="Ej. Día (08:00 - 20:00)" class="flex-1 border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
            <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-4 py-2 rounded-lg text-sm">Agregar</button>
          </form>
          <ul id="shiftTypesList" class="divide-y divide-slate-100">
            <!-- Cargado dinámicamente -->
          </ul>
        </div>

      </div>
    </section>
  </main>

  <!-- LÓGICA JAVASCRIPT Y PERSISTENCIA DE DATOS -->
  <script>
    // ESTADO INICIAL Y PERSISTENCIA (LOCALSTORAGE)
    let appState = {
      supervisors: JSON.parse(localStorage.getItem('rsj_supervisors')) || ["Antonio González", "Evelyn Rojas"],
      shiftTypes: JSON.parse(localStorage.getItem('rsj_shiftTypes')) || ["Largo Día (08:00 - 20:00)", "Noche (20:00 - 08:00)", "Mañana (08:00 - 16:00)", "Tarde (12:00 - 20:00)"],
      residents: JSON.parse(localStorage.getItem('rsj_residents')) || [],
      history: JSON.parse(localStorage.getItem('rsj_history')) || [],
      currentSupervisor: localStorage.getItem('rsj_currentSupervisor') || "Antonio González"
    };

    // AL CARGAR LA PÁGINA
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('shiftDateInput').valueAsDate = new Date();
      renderSupervisors();
      renderShiftTypes();
      renderResidents();
      renderHistory();
      renderShiftCards();
    });

    // CAMBIO DE PESTAÑAS
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-sky-600', 'text-white', 'border-sky-600');
        btn.classList.add('bg-white', 'text-slate-600', 'border-transparent');
      });

      document.getElementById(tabId).classList.remove('hidden');
      const activeBtn = document.getElementById('btn-' + tabId);
      activeBtn.classList.remove('bg-white', 'text-slate-600', 'border-transparent');
      activeBtn.classList.add('bg-sky-600', 'text-white', 'border-sky-600');
    }

    // JEFES DE TURNO
    function renderSupervisors() {
      const select = document.getElementById('currentSupervisorSelect');
      const list = document.getElementById('supervisorsList');
      select.innerHTML = '';
      list.innerHTML = '';

      appState.supervisors.forEach((sup, idx) => {
        // Opción en Select
        const option = document.createElement('option');
        option.value = sup;
        option.textContent = sup;
        if (sup === appState.currentSupervisor) option.selected = true;
        select.appendChild(option);

        // Ítem en Configuración
        const li = document.createElement('li');
        li.className = "py-2 flex justify-between items-center text-sm text-slate-700";
        li.innerHTML = `
          <span>${sup}</span>
          <button onclick="deleteSupervisor(${idx})" class="text-rose-500 hover:text-rose-700 font-semibold text-xs">Eliminar</button>
        `;
        list.appendChild(li);
      });
    }

    function changeSupervisor(val) {
      appState.currentSupervisor = val;
      localStorage.setItem('rsj_currentSupervisor', val);
    }

    function addSupervisor(e) {
      e.preventDefault();
      const input = document.getElementById('newSupervisorInput');
      const val = input.value.trim();
      if (val && !appState.supervisors.includes(val)) {
        appState.supervisors.push(val);
        localStorage.setItem('rsj_supervisors', JSON.stringify(appState.supervisors));
        input.value = '';
        renderSupervisors();
      }
    }

    function deleteSupervisor(idx) {
      appState.supervisors.splice(idx, 1);
      localStorage.setItem('rsj_supervisors', JSON.stringify(appState.supervisors));
      if (appState.supervisors.length > 0) appState.currentSupervisor = appState.supervisors[0];
      renderSupervisors();
    }

    // HORARIOS
    function renderShiftTypes() {
      const select = document.getElementById('shiftTypeSelect');
      const list = document.getElementById('shiftTypesList');
      select.innerHTML = '';
      list.innerHTML = '';

      appState.shiftTypes.forEach((st, idx) => {
        const option = document.createElement('option');
        option.value = st;
        option.textContent = st;
        select.appendChild(option);

        const li = document.createElement('li');
        li.className = "py-2 flex justify-between items-center text-sm text-slate-700";
        li.innerHTML = `
          <span>${st}</span>
          <button onclick="deleteShiftType(${idx})" class="text-rose-500 hover:text-rose-700 font-semibold text-xs">Eliminar</button>
        `;
        list.appendChild(li);
      });
    }

    function addShiftType(e) {
      e.preventDefault();
      const input = document.getElementById('newShiftTypeInput');
      const val = input.value.trim();
      if (val && !appState.shiftTypes.includes(val)) {
        appState.shiftTypes.push(val);
        localStorage.setItem('rsj_shiftTypes', JSON.stringify(appState.shiftTypes));
        input.value = '';
        renderShiftTypes();
      }
    }

    function deleteShiftType(idx) {
      appState.shiftTypes.splice(idx, 1);
      localStorage.setItem('rsj_shiftTypes', JSON.stringify(appState.shiftTypes));
      renderShiftTypes();
    }

    // GESTIÓN DE RESIDENTES
    function saveResident(e) {
      e.preventDefault();
      const id = document.getElementById('editResidentId').value;
      const name = document.getElementById('resName').value.trim();
      const room = document.getElementById('resRoom').value.trim();
      const notes = document.getElementById('resNotes').value.trim();

      if (id) {
        const res = appState.residents.find(r => r.id === id);
        if (res) {
          res.name = name;
          res.room = room;
          res.notes = notes;
        }
      } else {
        appState.residents.push({
          id: Date.now().toString(),
          name,
          room,
          notes
        });
      }

      localStorage.setItem('rsj_residents', JSON.stringify(appState.residents));
      resetResidentForm();
      renderResidents();
      renderShiftCards();
    }

    function resetResidentForm() {
      document.getElementById('editResidentId').value = '';
      document.getElementById('residentForm').reset();
    }

    function editResident(id) {
      const res = appState.residents.find(r => r.id === id);
      if (res) {
        document.getElementById('editResidentId').value = res.id;
        document.getElementById('resName').value = res.name;
        document.getElementById('resRoom').value = res.room || '';
        document.getElementById('resNotes').value = res.notes || '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function deleteResident(id) {
      if (confirm('¿Está seguro de eliminar este residente?')) {
        appState.residents = appState.residents.filter(r => r.id !== id);
        localStorage.setItem('rsj_residents', JSON.stringify(appState.residents));
        renderResidents();
        renderShiftCards();
      }
    }

    function renderResidents() {
      const list = document.getElementById('residentsList');
      list.innerHTML = '';

      if (appState.residents.length === 0) {
        list.innerHTML = `<p class="text-sm text-slate-500 italic col-span-2">No hay residentes registrados.</p>`;
        return;
      }

      appState.residents.forEach(r => {
        const div = document.createElement('div');
        div.className = "bg-slate-50 border border-slate-200 rounded-lg p-4 flex flex-col justify-between";
        div.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-1">
              <h4 class="font-bold text-slate-800 text-sm">${r.name}</h4>
              <span class="text-xs font-semibold px-2 py-0.5 bg-slate-200 rounded text-slate-700">${r.room || 'Sin hab.'}</span>
            </div>
            <p class="text-xs text-slate-600 mt-2">${r.notes || 'Sin observaciones médicas registradas.'}</p>
          </div>
          <div class="flex justify-end gap-3 mt-4 pt-2 border-t border-slate-200 text-xs font-semibold">
            <button onclick="editResident('${r.id}')" class="text-sky-600 hover:
